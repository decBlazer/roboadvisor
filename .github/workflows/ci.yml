name: Robo-Advisor Infrastructure CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  terraform-validate:
    name: Terraform HCL Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  cpp-build-and-test:
    name: Build & Test C++ Core Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install CMake & Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential g++

      - name: Configure CMake
        run: |
          mkdir -p cpp_core/build
          cd cpp_core/build
          cmake ..

      - name: Build C++ Test Executable
        run: |
          cd cpp_core/build
          make run_cpp_tests

      - name: Run C++ Unit Tests
        run: |
          ./cpp_core/build/run_cpp_tests

  python-backend-test:
    name: Backend API & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest backend/test_main.py

      - name: Run Quantitative Speed Benchmark
        run: |
          python backend/benchmark.py

      - name: Start FastAPI Background Server & Run Locust Load Test
        run: |
          cd backend
          uvicorn main:app --port 8000 &
          sleep 3
          locust -f ../load_tests/locustfile.py --headless -u 10 -r 5 --run-time 5s --host http://localhost:8000

  docker-build-check:
    name: Docker Container Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Validate Docker Compose Build
        run: |
          docker compose build
